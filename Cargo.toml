[package]
name = "ffbuildtool"
version = "5.1.1"
authors = ["OpenFusion Contributors"]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
log = "0.4.35"
reqwest = { version = "0.12.28", default-features = false, features = ["stream", "rustls-tls"] }
liblzma = { version = "0.3.6", features = ["static"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
clap = { version = "4.6.9", features = ["derive"], optional = true }
indicatif = { version = "0.17.11", features = ["tokio", "improved_unicode"], optional = true }
futures-util = "0.3.34"
countio = { version = "0.2.19", optional = true }

[lib]
name = "ffbuildtool"

[features]
default = ["lzma", "cli"]
lzma = ["dep:liblzma", "dep:countio"]
cli = ["dep:clap", "dep:indicatif"]

[[bin]]
name = "ffbuildtool"
required-features = ["cli"]

[[example]]
name = "gen_manifest"

[[example]]
name = "gen_bare"

[[example]]
name = "validate_compressed"

[[example]]
name = "validate_uncompressed"

[[example]]
name = "extract_bundle"

[[example]]
name = "download_build"

[[example]]
name = "repair_build"

[dev-dependencies]
env_logger = { version = "0.11.12", features = ["color"] }
